# SPDX-License-Identifier: GPL-3.0-only
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"  # weekly: long fuzzing + reproducibility

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_FROZEN: "1"
  PYTHONHASHSEED: "0"

jobs:
  lint:
    name: Lint (Python, MicroPython compat, C format, SPDX)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: sudo apt-get update && sudo apt-get install -y clang-format shellcheck
      - name: Python deps (without the upstream trezorlib)
        run: uv sync --no-install-package trezor
      - run: uv run --no-sync ruff check src tests tools
      - run: uv run --no-sync ruff format --check src tests tools
      - run: uv run --no-sync python tools/generate_i18n_rom.py --check
      - run: uv run --no-sync python tools/generate_frozen_qstr.py --check
      - run: uv run --no-sync python tools/check_upy_compat.py
      - run: python3 tools/check_spdx.py
      - run: tools/check_c_format.sh
      - run: shellcheck tools/*.sh tools/ci/*.sh

  host-tests:
    name: Host unit tests (CPython) + coverage
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv sync --no-install-package trezor
      - run: uv run --no-sync pytest -q tests/host --cov --cov-report=xml --cov-report=term-missing:skip-covered
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage.xml

  c-tests:
    name: C libraries (${{ matrix.cc }}, ASan+UBSan)
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        cc: [clang, gcc]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sudo apt-get update && sudo apt-get install -y cmake dosfstools
      - run: cmake -S tests/c -B build/c -DFEURISTIC_SANITIZE=ON -DCMAKE_BUILD_TYPE=Debug -DCMAKE_C_COMPILER=${{ matrix.cc }}
      - run: cmake --build build/c -j"$(nproc)"
      - run: ctest --test-dir build/c --output-on-failure -j"$(nproc)"

  arm-cross:
    name: C libraries cross-compile (arm-none-eabi, -Werror)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sudo apt-get update && sudo apt-get install -y gcc-arm-none-eabi libnewlib-arm-none-eabi
      - run: tools/ci/arm-cross-check.sh

  fuzz:
    name: Fuzzing (libFuzzer)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev
      - name: Fuzz each target (60 s on push, 30 min weekly)
        run: CLANG=clang tools/fuzz.sh ${{ github.event_name == 'schedule' && 1800 || 60 }}
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-crashes
          path: build/fuzz/artifacts/

  firmware:
    name: Firmware ${{ matrix.model }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        model: [T2B1, T3B1]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
      - uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15
      - run: tools/ci/fetch-upstream.sh
      - name: Build
        run: tools/ci/nix-build.sh firmware "$(echo ${{ matrix.model }} | tr A-Z a-z)"
      - name: Collect artifact
        run: tools/ci/collect-firmware.sh ${{ matrix.model }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: firmware-${{ matrix.model }}
          path: dist/

  emulator-tests:
    name: Emulator + functional tests (${{ matrix.model }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        model: [T2B1, T3B1]
    env:
      FEURISTIC_EMU: ${{ github.workspace }}/upstream/trezor-firmware/core/build-xtask/artifacts/${{ matrix.model }}/firmware-emu
      FEURISTIC_EMU_FROZEN: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
      - uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: tools/ci/fetch-upstream.sh
      - run: tools/ci/nix-build.sh emulator "$(echo ${{ matrix.model }} | tr A-Z a-z)" --frozen --pyopt=false
      - run: uv sync
      - name: MicroPython compatibility (with mpy-cross)
        run: uv run --no-sync python tools/check_upy_compat.py
      - name: Functional tests
        run: uv run --no-sync pytest -v tests/functional --junitxml=build/functional.xml
      - name: Interop tools (pcscd + vsmartcard vpcd, GnuPG, OpenSC)
        run: |
          sudo apt-get update
          sudo apt-get install -y pcscd vsmartcard-vpcd opensc gnupg scdaemon
          sudo systemctl stop pcscd.socket pcscd.service || true
          sudo pcscd --disable-polkit
      - name: Interop tests (real GnuPG / OpenSC against the emulator)
        env:
          FEURISTIC_INTEROP: "1"
        run: uv run --no-sync pytest -v tests/functional/interop --junitxml=build/interop.xml
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: functional-results-${{ matrix.model }}
          path: build/*.xml

  reproducibility:
    name: Reproducible build check (${{ matrix.model }})
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        model: [T2B1, T3B1]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
      - run: tools/ci/fetch-upstream.sh
      - run: tools/ci/reproducible.sh ${{ matrix.model }}

  sbom:
    name: SBOM
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: tools/ci/fetch-upstream.sh
      - run: python3 tools/sbom.py --output dist/feuristic.spdx.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: dist/feuristic.spdx.json
