# SPDX-License-Identifier: GPL-3.0-only
name: Release

# Tag vX.Y.Z (or vX.Y.Z-rcN) to build the release artifacts. Releases are
# published as *pre-releases* until the hardware acceptance tests R01–R16
# (docs/acceptance/) have passed on both T2B1 and T3B1.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.model }}
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        model: [T2B1, T3B1]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
      - run: tools/ci/fetch-upstream.sh
      - name: Check that the tag matches src/feuristic/version.py
        run: |
          v=$(python3 -c "import sys; sys.path.insert(0,'src'); from feuristic.version import VERSION; print(VERSION)")
          test "v$v" = "${GITHUB_REF_NAME}"
      - run: tools/ci/nix-build.sh firmware "$(echo ${{ matrix.model }} | tr A-Z a-z)"
      - run: tools/ci/collect-firmware.sh ${{ matrix.model }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.model }}
          path: dist/

  publish:
    name: Draft GitHub release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: tools/ci/fetch-upstream.sh
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - run: python3 tools/sbom.py --output "dist/feuristic-${GITHUB_REF_NAME}.spdx.json" --firmware dist/*.bin
      - run: cd dist && sha256sum *.bin *.spdx.json > SHA256SUMS
      - name: Create draft pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" dist/* --draft --prerelease
          --title "feuristic $GITHUB_REF_NAME"
          --notes-file docs/release-notes-template.md
